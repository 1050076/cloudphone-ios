name: CloudPhone
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  CloudPhone:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 吊手机
        CFBundleName: 吊手机
        # Version numbers come from build settings so a build can stamp its own
        # (TestFlight requires an ever-increasing CFBundleVersion per upload).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: CloudPhone 需要使用麦克风进行语音通话
        NSCameraUsageDescription: CloudPhone 需要使用摄像头进行视频画面传输
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # The distribution identity this app ships under (team B7F666RK24).
        # CI passes the same value as a build setting; keeping it here means a
        # local build produces the same bundle id as the signed one.
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyu.cloudphone
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
